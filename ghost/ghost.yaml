# Ghost, the publishing platform, backed by the MySQL in mysql.yaml.
#
# Ghost is configured entirely through environment variables: a double
# underscore is a level of nesting in its config file, so
# database__connection__host is database.connection.host.
#
# Two things come from objects you create by hand in Lab 12 rather than from
# this file:
#   - the ghost-db Secret, holding the database passwords
#   - the ghost-config ConfigMap, holding `url` -- the address readers use.
#     Ghost writes it into every link it generates, so it has to be the
#     address you will actually browse to: the load balancer's.
apiVersion: v1
kind: Service
metadata:
  name: ghost
  labels:
    app: ghost
spec:
  type: NodePort
  ports:
    - port: 2368
      targetPort: 2368
      # Fixed, so HAProxy on the load balancer can name it.
      nodePort: 30080
      name: http
  selector:
    app: ghost
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ghost-content
  labels:
    app: ghost
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost
  labels:
    app: ghost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ghost
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ghost
    spec:
      # Ghost exits if the database is not there when it starts. Waiting for
      # the port here turns a few CrashLoopBackOff restarts into one clean
      # start, and makes the dependency visible in `kubectl describe pod`.
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 2; done"]
      containers:
        - name: ghost
          image: ghost:6
          env:
            - name: url
              valueFrom:
                configMapKeyRef:
                  name: ghost-config
                  key: url
            - name: database__client
              value: mysql
            - name: database__connection__host
              value: mysql
            - name: database__connection__user
              value: ghost
            - name: database__connection__database
              value: ghost
            - name: database__connection__password
              valueFrom:
                secretKeyRef:
                  name: ghost-db
                  key: password
          ports:
            - containerPort: 2368
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 768Mi
          # A public, unauthenticated endpoint that only answers once Ghost has
          # migrated its schema and booted -- the site root answers earlier.
          readinessProbe:
            httpGet:
              path: /ghost/api/admin/site/
              port: 2368
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 2368
            initialDelaySeconds: 120
            periodSeconds: 20
          volumeMounts:
            - name: content
              mountPath: /var/lib/ghost/content
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: ghost-content
